# Netlify configuration — HTTP security headers
#
# These headers are applied by Netlify's edge at response time. They cannot be
# set from a static host any other way (a plain <meta> tag cannot set HSTS,
# X-Frame-Options, or frame-ancestors). See SECURITY_REVIEW.md for the full
# rationale behind every value below.
#
# NOTE: Local `npx serve` / `python3 -m http.server` does NOT apply these — they
# only take effect once deployed to Netlify. Verify post-deploy with
# `curl -I https://<your-site>` or https://securityheaders.com.

[[headers]]
  for = "/*"

  [headers.values]
    # ---- Content-Security-Policy (single enforced policy, all routes) -------
    # Tight on the directives that enable code execution / data exfil; permissive
    # on low-risk ones (img). The Facebook / Instagram / TikTok embeds render in
    # their OWN cross-origin iframes (governed by their own CSP), so we only need
    # to allow their embed scripts to load and their iframes to be framed here.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://www.instagram.com https://www.tiktok.com; frame-src 'self' https://www.facebook.com https://web.facebook.com https://staticxx.facebook.com https://www.instagram.com https://www.tiktok.com; connect-src 'self' https://connect.facebook.net https://www.facebook.com https://graph.facebook.com https://www.instagram.com https://www.tiktok.com; upgrade-insecure-requests"

    # ---- Defense-in-depth headers (zero breakage risk) ---------------------
    # Clickjacking: refuse to be framed by other origins (reinforces frame-ancestors).
    X-Frame-Options = "SAMEORIGIN"
    # Stop browsers from MIME-sniffing responses into an unexpected content type.
    X-Content-Type-Options = "nosniff"
    # Don't leak full URLs (paths/queries) to third parties via the Referer header.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS for a year, including subdomains.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Disable powerful browser features the site never uses.
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
